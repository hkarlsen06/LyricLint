	viewBox="3.6 3.6 24.8 24.8"
	width="32"
	height="32"
	role="img"
	aria-label="LyricLint"
>
	<title>LyricLint</title>
	<!-- No tile: the mark is the icon. It carries #dea645 so it clears Safari's
	     contrast threshold against its #282828 dark tab bar on its own — a mark

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer PR commit supersedes its checks; production pushes still finish their gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Content hashes survive checkout timestamp changes. The restore prefix is
      # bounded by dependencies/configuration: Prettier does not invalidate its
      # own cache when a plugin changes. See docs/ci.md.
      - name: Cache lint results
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ci-lint
          key: ${{ runner.os }}-lint-v1-${{ hashFiles('bun.lock', 'package.json', 'eslint.config.js', 'prettier.config.js', '.prettierignore', '.gitignore', '**/tsconfig.json', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-v1-${{ hashFiles('bun.lock', 'package.json', 'eslint.config.js', 'prettier.config.js', '.prettierignore', '.gitignore', '**/tsconfig.json', 'vite.config.ts') }}-
      - name: Lint
        run: |
          bunx prettier --check . --cache --cache-strategy content --cache-location node_modules/.cache/ci-lint/prettier
          bunx oxlint
          bunx eslint . --cache --cache-strategy content --cache-location node_modules/.cache/ci-lint/eslint
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:unit -- --run

  assistant:
    name: assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-assistant-${{ hashFiles('services/rules-assistant/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-assistant-
      - run: bun run assistant:test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test:browsers
      - run: bunx playwright test

  # The production deploy depends on CI. Cloudflare Pages' own automatic
  # production-branch deployments are disabled; this job triggers the build
  # through a deploy hook instead, and only after every CI job is green.
  # Cloudflare still runs the build itself (its build variables, e.g.
  # PUBLIC_APPLE_MUSIC_TOKEN, stay where they are), and PR preview
  # deployments are untouched.
  #
  # CLOUDFLARE_DEPLOY_HOOK_URL is a repository secret holding a deploy hook
  # created for the production branch (Pages project → Settings → Builds &
  # deployments → Deploy hooks). A missing secret fails this job loudly
  # rather than skipping the deploy in silence.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, assistant, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger the Cloudflare Pages production deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null

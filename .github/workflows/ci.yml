name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer PR commit supersedes its checks; production pushes still finish their gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Content hashes survive checkout timestamp changes. The restore prefix is
      # bounded by dependencies/configuration: Prettier does not invalidate its
      # own cache when a plugin changes. See docs/ci.md.
      - name: Cache lint results
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ci-lint
          key: ${{ runner.os }}-lint-v1-${{ hashFiles('bun.lock', 'package.json', 'eslint.config.js', 'prettier.config.js', '.prettierignore', '.gitignore', '**/tsconfig.json', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-v1-${{ hashFiles('bun.lock', 'package.json', 'eslint.config.js', 'prettier.config.js', '.prettierignore', '.gitignore', '**/tsconfig.json', 'vite.config.ts') }}-
      - name: Lint
        run: |
          bunx prettier --check . --cache --cache-strategy content --cache-location node_modules/.cache/ci-lint/prettier
          bunx oxlint
          bunx eslint . --cache --cache-strategy content --cache-location node_modules/.cache/ci-lint/eslint
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test:unit -- --run

  assistant:
    name: assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-assistant-${{ hashFiles('services/rules-assistant/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-assistant-
      - run: bun run assistant:test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun setup prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # The image already contains both browsers and their OS dependencies.
      # A dependency update can change browser revisions before the image tag
      # is refreshed; install only when those revisions are absent.
      - name: Check the preinstalled browsers
        run: |
          if ! bun -e 'import { existsSync } from "node:fs"; import { chromium, webkit } from "playwright"; process.exit([chromium, webkit].every(browser => existsSync(browser.executablePath())) ? 0 : 1)'; then
            bunx playwright install --with-deps --only-shell chromium webkit
          fi
      - name: Build the site
        env:
          PRODUCTION_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PUBLIC_APPLE_MUSIC_TOKEN: ${{ github.event_name == 'push' && vars.PUBLIC_APPLE_MUSIC_TOKEN || '' }}
          PUBLIC_ASSISTANT_ANSWERS_URL: ${{ github.event_name == 'push' && vars.PUBLIC_ASSISTANT_ANSWERS_URL || '' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ github.event_name == 'push' && vars.PUBLIC_TURNSTILE_SITE_KEY || '' }}
        run: |
          if [ "$PRODUCTION_BUILD" = true ]; then
            for name in PUBLIC_APPLE_MUSIC_TOKEN PUBLIC_ASSISTANT_ANSWERS_URL PUBLIC_TURNSTILE_SITE_KEY; do
              if [ -z "${!name}" ]; then
                echo "Missing production build variable: $name" >&2
                exit 1
              fi
            done
          fi
          bun run build
      - run: bunx playwright test
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - name: Save E2E retry traces
        if: ${{ !cancelled() && hashFiles('test-results/**/trace.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ github.sha }}
          path: test-results/
          overwrite: true
          retention-days: 7
      - name: Save the tested production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: production-site-${{ github.sha }}
          path: build/
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  # Publish the exact artifact that passed E2E, after every required check succeeds.
  # Pages' automatic production builds remain disabled; PR previews stay on Pages.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, assistant, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check the production revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_sha" = "$COMMIT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision supersedes this deployment."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.revision.outputs.current == 'true'
      - name: Check deployment configuration
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying; see docs/ci.md." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.revision.outputs.current == 'true'
      - uses: actions/download-artifact@v8
        if: steps.revision.outputs.current == 'true'
        with:
          name: production-site-${{ github.sha }}
          path: build/
      - name: Verify the deployed assistant corpus
        if: steps.revision.outputs.current == 'true'
        env:
          PUBLIC_ASSISTANT_ANSWERS_URL: ${{ vars.PUBLIC_ASSISTANT_ANSWERS_URL }}
        run: bun scripts/check-assistant-deployment.mjs
      - name: Deploy the tested site to Cloudflare Pages
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: bunx --package wrangler@4.129.0 wrangler pages deploy build --project-name lyriclint --branch main --commit-hash "$COMMIT_SHA" --commit-dirty=false

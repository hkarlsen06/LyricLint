version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # `typescript` is deliberately held at 6 here. svelte-check and
      # typescript-eslint both read the compiler API off that package name, and
      # TS 7 no longer ships one. TS 7 is consumed through the
      # @typescript/native alias instead — so a major bump of this entry is
      # always the broken arrangement.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The alias target, and it has to be skipped entirely rather than pinned.
      # `@typescript/native` is not a package on npm — it is only the name the
      # alias is installed under — so Dependabot's lookup 404s and the whole
      # update run for this directory reports a failure. Bump it by hand
      # alongside svelte-check, which is what decides the flag anyway.
      - dependency-name: '@typescript/native'
      # Pinned exactly and bumped by hand: a Harper upgrade changes what the
      # linter says, so it is a reviewed event — harper.test.ts pins the
      # refused-rule list against the real engine and fails loudly on a rename
      # or a newly shipped censoring rule — not something a fresh install may
      # take silently.
      - dependency-name: harper.js
      # Pinned exactly: the package is unmaintained and its n-gram data is the
      # value, so the pin records the dataset the language detection was tuned
      # against.
      - dependency-name: languagedetect

  # No such hold here: the assistant is plain tsc with no svelte-check and no
  # typescript-eslint, so it runs TS 7 as the `typescript` package directly.
  - package-ecosystem: bun
    directory: /services/rules-assistant
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
